<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<link rel="icon" href="assets/logo.png">
<title>Noerz AI Chat — Noerz Equipments</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg-0:#050505;--bg-1:#0c0c0c;--bg-2:#121212;--bg-3:#181818;--bg-4:#1f1f1f;--line-0:#1a1a1a;--line-1:#272727;--line-2:#333;--line-3:#404040;--txt-0:#f5f5f7;--txt-1:#d2d2d7;--txt-2:#a1a1a6;--txt-3:#86868b;--txt-4:#6e6e73;--txt-5:#48484a;--white:#fff;--black:#000;--ease-ios:cubic-bezier(0.32,0.72,0,1);--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,monospace;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
html,body{background:var(--bg-0);color:var(--txt-0);font-family:var(--sans);font-size:15px;line-height:1.47059;letter-spacing:-0.022em;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden;height:100vh;height:100dvh}
body{background:linear-gradient(180deg,#050505 0%,#080808 100%);display:flex;flex-direction:column}
body::before{content:"";position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:1000px;height:700px;background:radial-gradient(circle,rgba(20,20,20,0.9) 0%,transparent 70%);pointer-events:none;z-index:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;letter-spacing:inherit}
textarea{font-family:inherit;letter-spacing:inherit}
::selection{background:var(--white);color:var(--black)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--line-3)}

.header{flex-shrink:0;background:rgba(5,5,5,0.75);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-bottom:0.5px solid rgba(255,255,255,0.05);z-index:100;position:relative}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px;max-width:900px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.header-inner{padding:0 16px}}
.header-left{display:flex;align-items:center;gap:10px;min-width:0}
.back-mini{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.07);display:grid;place-items:center;color:var(--txt-1);transition:background .18s var(--ease-ios),transform .18s var(--ease-ios);flex-shrink:0}
.back-mini:hover{background:rgba(255,255,255,0.1);color:var(--txt-0)}
.back-mini:active{transform:scale(0.92)}
.back-mini svg{width:15px;height:15px;stroke-width:2.2}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{height:26px;width:auto;display:block;filter:brightness(0) invert(1)}
.brand-title{font-size:15px;font-weight:600;letter-spacing:-0.024em;color:var(--txt-0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hamburger{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.07);display:grid;place-items:center;color:var(--txt-1);transition:background .22s,transform .18s;flex-shrink:0}
.hamburger:hover{background:rgba(255,255,255,0.09);color:var(--txt-0)}
.hamburger:active{transform:scale(0.94)}
.hamburger svg{width:18px;height:18px;overflow:visible}
.hamburger .line{stroke:currentColor;stroke-width:1.8;stroke-linecap:round;transition:transform .3s;transform-origin:center;transform-box:fill-box}
.hamburger.active .line-top{transform:translateY(3px) rotate(45deg)}
.hamburger.active .line-bottom{transform:translateY(-3px) rotate(-45deg)}

.menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .22s}
.menu-backdrop.show{opacity:1;pointer-events:auto}
.menu{position:fixed;top:66px;right:24px;width:220px;background:rgba(24,24,26,0.92);backdrop-filter:saturate(160%) blur(24px);-webkit-backdrop-filter:saturate(160%) blur(24px);border:0.5px solid rgba(255,255,255,0.1);border-radius:18px;padding:6px;z-index:201;opacity:0;transform:translateY(-6px) scale(0.96);transform-origin:top right;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 24px 70px rgba(0,0,0,0.7)}
.menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
@media (max-width:640px){.menu{right:16px;left:16px;width:auto}}
.menu-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:var(--txt-1);font-size:15px;font-weight:500;transition:background .12s,color .12s}
.menu-item:hover{background:rgba(255,255,255,0.06);color:var(--txt-0)}
.menu-item svg{width:17px;height:17px;stroke-width:1.9;color:var(--txt-2)}

.chat-main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}
.chat-scroll{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding:24px 0 8px}
.chat-inner{max-width:780px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.chat-inner{padding:0 16px}}

.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px 30px;gap:16px}
.welcome-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));border:0.5px solid rgba(255,255,255,0.1);display:grid;place-items:center;color:var(--txt-0);box-shadow:0 12px 32px rgba(0,0,0,0.4)}
.welcome-icon svg{width:28px;height:28px;stroke-width:1.7}
.welcome-title{font-size:24px;font-weight:600;letter-spacing:-0.032em;line-height:1.15;color:var(--txt-0)}
.welcome-sub{font-size:14.5px;color:var(--txt-2);line-height:1.5;max-width:420px}
.suggestions{display:grid;grid-template-columns:1fr;gap:8px;width:100%;max-width:540px;margin-top:14px}
@media (min-width:640px){.suggestions{grid-template-columns:1fr 1fr}}
.suggest{padding:14px 16px;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.07);border-radius:14px;text-align:left;cursor:pointer;transition:background .18s,border-color .18s,transform .18s;display:flex;flex-direction:column;gap:3px}
.suggest:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.13);transform:translateY(-1px)}
.suggest:active{transform:translateY(0)}
.suggest-title{font-size:13.5px;font-weight:600;color:var(--txt-0);letter-spacing:-0.018em}
.suggest-desc{font-size:12px;color:var(--txt-3);line-height:1.4}

.msg{display:flex;gap:14px;padding:20px 0;border-bottom:0.5px solid rgba(255,255,255,0.04);animation:msgIn .3s var(--ease-ios)}
.msg:last-child{border-bottom:none}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:700;margin-top:2px;overflow:hidden}
.msg.user .msg-avatar{background:rgba(255,255,255,0.1);color:var(--txt-1);border:0.5px solid rgba(255,255,255,0.1)}
.msg.ai .msg-avatar{background:linear-gradient(135deg,rgba(255,255,255,0.18),rgba(255,255,255,0.06));color:var(--txt-0);border:0.5px solid rgba(255,255,255,0.15)}
.msg-avatar svg{width:16px;height:16px;stroke-width:2}
.msg-body{flex:1;min-width:0;padding-top:2px}
.msg-name{font-size:13px;font-weight:600;color:var(--txt-1);margin-bottom:6px}
.msg.ai .msg-name{color:var(--txt-0)}
.msg-text{font-size:15px;line-height:1.6;color:var(--txt-0);word-break:break-word;white-space:pre-wrap}
.msg.user .msg-text{color:var(--txt-1)}

.dots{display:inline-flex;gap:5px;padding:6px 0;align-items:center}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--txt-3);animation:bdot 1.2s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes bdot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}

.chat-input-area{flex-shrink:0;background:linear-gradient(180deg,transparent 0%,rgba(5,5,5,0.85) 30%,var(--bg-0) 60%);padding:8px 0 20px;position:relative;z-index:2}
.chat-input-wrap{max-width:780px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.chat-input-wrap{padding:0 16px}}
.chat-input-box{display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.1);border-radius:22px;padding:8px 8px 8px 18px;transition:background .22s,border-color .22s,box-shadow .22s}
.chat-input-box:focus-within{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.2);box-shadow:0 0 0 4px rgba(255,255,255,0.04)}
.chat-input-box textarea{flex:1;background:transparent;border:none;outline:none;color:var(--txt-0);font-size:16px;line-height:1.5;padding:8px 0;resize:none;max-height:180px;min-height:24px;overflow-y:auto;scrollbar-width:thin}
.chat-input-box textarea::placeholder{color:var(--txt-4)}
.chat-input-box textarea::-webkit-scrollbar{width:4px}
.chat-input-box textarea::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--white);color:var(--black);display:grid;place-items:center;flex-shrink:0;transition:background .18s,transform .18s,opacity .18s}
.send-btn:hover:not(:disabled){background:#e8e8e8;transform:scale(1.04)}
.send-btn:active:not(:disabled){transform:scale(0.94)}
.send-btn:disabled{background:rgba(255,255,255,0.12);color:var(--txt-4);cursor:not-allowed}
.send-btn svg{width:15px;height:15px;stroke-width:2.4}
.hint{font-size:11.5px;color:var(--txt-4);text-align:center;margin-top:10px}
.hint kbd{font-family:var(--mono);font-size:10.5px;background:rgba(255,255,255,0.07);border:0.5px solid rgba(255,255,255,0.1);border-radius:4px;padding:1px 5px;margin:0 2px;color:var(--txt-3)}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-left">
      <a href="/" class="back-mini" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </a>
      <a href="/" class="brand">
        <img src="assets/logo.png" alt="Noerz" class="brand-logo">
        <span class="brand-title">Noerz AI Chat</span>
      </a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none">
        <line class="line line-top" x1="4" y1="9" x2="20" y2="9"/>
        <line class="line line-bottom" x1="4" y1="15" x2="20" y2="15"/>
      </svg>
    </button>
  </div>
</header>

<div class="menu-backdrop" id="menuBackdrop"></div>
<div class="menu" id="menu">
  <a href="/" class="menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 21V12h6v9"/></svg>Home</a>
  <a href="donasi.html" class="menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>Donasi</a>
  <a href="about.html" class="menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>About</a>
</div>

<main class="chat-main">

  <div class="chat-scroll" id="chatScroll">
    <div class="chat-inner">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/></svg>
        </div>
        <h1 class="welcome-title">Halo, saya Noerz AI</h1>
        <p class="welcome-sub">Asisten AI siap membantu Anda. Tanyakan apa saja — coding, ide, tulis, atau sekedar ngobrol.</p>
        <div class="suggestions">
          <button class="suggest" data-prompt="Jelaskan apa itu REST API dengan bahasa sederhana.">
            <div class="suggest-title">Apa itu REST API?</div>
            <div class="suggest-desc">Penjelasan singkat & jelas</div>
          </button>
          <button class="suggest" data-prompt="Buatkan puisi pendek tentang senja.">
            <div class="suggest-title">Buat puisi senja</div>
            <div class="suggest-desc">Kreatif & puitis</div>
          </button>
          <button class="suggest" data-prompt="Rekomendasi 5 nama startup teknologi yang keren.">
            <div class="suggest-title">Ide nama startup</div>
            <div class="suggest-desc">5 pilihan nama</div>
          </button>
          <button class="suggest" data-prompt="Cara belajar JavaScript dari nol untuk pemula.">
            <div class="suggest-title">Belajar JavaScript</div>
            <div class="suggest-desc">Roadmap untuk pemula</div>
          </button>
        </div>
      </div>
      <div id="messages"></div>
    </div>
  </div>

  <div class="chat-input-area">
    <div class="chat-input-wrap">
      <div class="chat-input-box">
        <textarea id="chatInput" placeholder="Tanya Noerz AI..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" disabled aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
      <div class="hint">Tekan <kbd>Enter</kbd> untuk kirim · <kbd>Shift</kbd>+<kbd>Enter</kbd> untuk baris baru</div>
    </div>
  </div>

</main>

<script>
"use strict";
/* Endpoint lokal — apikey di-handle backend */
const url = "/api/chatai";
const $ = id => document.getElementById(id);
const scroll = $("chatScroll");
const messagesEl = $("messages");
const welcomeEl = $("welcome");
const input = $("chatInput");
const btn = $("sendBtn");
let busy = false;

const ham=$("hamburger"),menu=$("menu"),bd=$("menuBackdrop");
function setMenu(o){menu.classList.toggle("show",o);bd.classList.toggle("show",o);ham.classList.toggle("active",o)}
ham.addEventListener("click",e=>{e.stopPropagation();setMenu(!menu.classList.contains("show"))});
bd.addEventListener("click",()=>setMenu(false));
document.addEventListener("click",e=>{if(!menu.contains(e.target)&&!ham.contains(e.target))setMenu(false)});

function autoResize(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}

function scrollToBottom(){
  scroll.scrollTop = scroll.scrollHeight;
}

function createMessage(role, text, loading){
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  if(role === "ai"){
    avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/></svg>';
  } else {
    avatar.textContent = "YOU";
  }
  const body = document.createElement("div");
  body.className = "msg-body";
  const name = document.createElement("div");
  name.className = "msg-name";
  name.textContent = role === "ai" ? "Noerz AI" : "You";
  body.appendChild(name);
  const content = document.createElement("div");
  content.className = "msg-text";
  if(loading){
    content.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  } else {
    content.textContent = text;
  }
  body.appendChild(content);
  wrap.appendChild(avatar);
  wrap.appendChild(body);
  return wrap;
}

function extractReply(data){
  if(!data) return "No response.";
  if(typeof data === "string") return data;
  const keys = ["response","reply","answer","message","result","text","output"];
  for(const k of keys){
    if(typeof data[k] === "string" && data[k].trim()) return data[k];
  }
  if(data.result && typeof data.result === "object"){
    for(const k of keys){
      if(typeof data.result[k] === "string" && data.result[k].trim()) return data.result[k];
    }
  }
  if(data.data) return extractReply(data.data);
  try { return JSON.stringify(data); } catch { return "No response."; }
}

async function send(){
  const text = input.value.trim();
  if(!text || busy) return;
  busy = true;
  if(welcomeEl && welcomeEl.parentNode) welcomeEl.remove();
  input.value = "";
  input.style.height = "auto";
  btn.disabled = true;
  messagesEl.appendChild(createMessage("user", text));
  scrollToBottom();
  const loader = createMessage("ai", "", true);
  messagesEl.appendChild(loader);
  scrollToBottom();
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ prompt: text })
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    loader.remove();
    messagesEl.appendChild(createMessage("ai", extractReply(data)));
    scrollToBottom();
  } catch(e){
    loader.remove();
    messagesEl.appendChild(createMessage("ai", "Something went wrong. Please try again."));
    scrollToBottom();
  } finally {
    busy = false;
    btn.disabled = !input.value.trim();
    input.focus();
  }
}

input.addEventListener("input", ()=>{
  autoResize();
  btn.disabled = !input.value.trim() || busy;
});
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
btn.addEventListener("click", send);

document.querySelectorAll(".suggest").forEach(s => {
  s.addEventListener("click", () => {
    input.value = s.dataset.prompt;
    autoResize();
    btn.disabled = false;
    send();
  });
});

setTimeout(()=>input.focus(), 200);
</script>
</body>
</html>
