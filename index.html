  { id:"catbox",   url:"catbox.html",   name:"Catbox Uploader",       cat:"Uploader",   desc:"Upload file dengan drag & drop, dapatkan URL publik.", icon:"upload" },
  { id:"tempmail", url:"tempmail.html", name:"TempMail Create",       cat:"Temp Mail",  desc:"Generate alamat email sementara untuk verifikasi.", icon:"mail" },
  { id:"inbox",    url:"inbox.html",    name:"TempMail Inbox",        cat:"Temp Mail",  desc:"Cek pesan masuk pada alamat email sementara kamu.", icon:"inbox" },
  { id:"chatai",   url:"chatai.html",   name:"Noerz AI Chat",         cat:"AI",         desc:"Chat dengan asisten AI untuk berbagai pertanyaan.", icon:"ai" }
];
const I = {
  download:'<path d="M12 3v13M7 12l5 5 5-5M4 21h16"/>',
  upload:  '<path d="M12 21V8M7 12l5-5 5 5M4 3h16"/>',
  heart:   '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 1 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8Z"/>',
  mail:    '<rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="m3 7 9 6 9-6"/>',
  inbox:   '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.5 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.5A2 2 0 0 0 16.7 4H7.3a2 2 0 0 0-1.8 1.5Z"/>',
  ai:      '<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/>',
  star:    '<path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.4l6.1-.9L12 3Z"/>',
  arrow:   '<path d="M5 12h14M13 6l6 6-6 6"/>'
};
const svg = (p,s=16) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const state = { search:"", cat:"all", favs: JSON.parse(localStorage.getItem("nz_favs")||"[]"), recent: JSON.parse(localStorage.getItem("nz_recent")||"[]") };
const saveFavs = () => { try { localStorage.setItem("nz_favs", JSON.stringify(state.favs)); } catch(e){} };
const $ = id => document.getElementById(id);
const grid = $("grid"), emptyEl = $("empty");
const recentSection = $("recentSection"), recentRow = $("recentRow"), recentCount = $("recentCount");

function render(){
  let list = TOOLS;
  if (state.cat === "Favorites") list = list.filter(t => state.favs.includes(t.id));
  else if (state.cat !== "all") list = list.filter(t => t.cat === state.cat);
  const q = state.search.trim().toLowerCase();
  if (q) list = list.filter(t => (t.name + " " + t.desc + " " + t.cat).toLowerCase().includes(q));
  if (!list.length){ grid.innerHTML = ""; emptyEl.classList.remove("hidden"); return; }
  emptyEl.classList.add("hidden");
  let html = "";
  for (let i = 0; i < list.length; i++){
    const t = list[i];
    const isFav = state.favs.indexOf(t.id) >= 0;
    html += '<a href="' + t.url + '" class="card">'
      + '<div class="card-head"><div class="card-icon">' + svg(I[t.icon],19) + '</div>'
      + '<button class="card-fav' + (isFav ? ' active' : '') + '" data-fav="' + t.id + '">' + svg(I.star,15) + '</button></div>'
      + '<div class="card-body"><div class="card-title">' + t.name + '</div><div class="card-desc">' + t.desc + '</div></div>'
      + '<div class="card-foot"><span class="badge"><span class="badge-dot"></span>' + t.cat + '</span>'
      + '<span class="card-open">Open <span class="card-open-icon">' + svg(I.arrow,11) + '</span></span></div></a>';
  }
  grid.innerHTML = html;
}
function renderRecent(){
  const ids = state.recent.slice(0,5);
  if (!ids.length){ recentSection.classList.add("hidden"); return; }
  recentSection.classList.remove("hidden");
  recentCount.textContent = ids.length;
  let html = "";
  for (let i = 0; i < ids.length; i++){
    const t = TOOLS.find(x => x.id === ids[i]);
    if (!t) continue;
    html += '<a href="' + t.url + '" class="recent-chip">' + svg(I[t.icon],14) + t.name + '</a>';
  }
  recentRow.innerHTML = html;
}
const ham = $("hamburger"), menu = $("menu"), bd = $("menuBackdrop");
function setMenu(open){ menu.classList.toggle("show", open); bd.classList.toggle("show", open); ham.classList.toggle("active", open); ham.setAttribute("aria-expanded", open ? "true" : "false"); }
ham.addEventListener("click", function(e){ e.stopPropagation(); setMenu(!menu.classList.contains("show")); });
bd.addEventListener("click", function(){ setMenu(false); });
document.addEventListener("click", function(e){ if (!menu.contains(e.target) && !ham.contains(e.target)) setMenu(false); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") setMenu(false); });
grid.addEventListener("click", function(e){
  const favBtn = e.target.closest("[data-fav]");
  if (!favBtn) return;
  e.preventDefault(); e.stopPropagation();
  const id = favBtn.dataset.fav;
  const i = state.favs.indexOf(id);
  if (i >= 0) state.favs.splice(i,1); else state.favs.push(id);
  saveFavs(); render();
});
$("filters").addEventListener("click", function(e){
  const btn = e.target.closest(".chip");
  if (!btn) return;
  state.cat = btn.dataset.cat;
  const chips = document.querySelectorAll(".chip");
  for (let i = 0; i < chips.length; i++) chips[i].classList.toggle("active", chips[i] === btn);
  render();
});
let searchTimer;
$("searchInput").addEventListener("input", function(e){
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(function(){ state.search = val; render(); }, 80);
});
document.addEventListener("keydown", function(e){
  if (e.key === "/" && document.activeElement.tagName !== "INPUT"){ e.preventDefault(); $("searchInput").focus(); }
});
(function(){
  const v = $("heroVideo");
  if (!v || !("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting){ if (v.paused) v.play().catch(function(){}); }
      else { if (!v.paused) v.pause(); }
    });
  }, { threshold: 0.05 });
  io.observe(v);
})();
render();
renderRecent();
</script>
</body>
</html>
