<!DOCTYPE html>
<html lang="id">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg-0:#050505;--bg-1:#0c0c0c;--bg-2:#121212;--bg-3:#181818;--bg-4:#1f1f1f;--line-0:#1a1a1a;--line-1:#272727;--line-2:#333;--line-3:#404040;--txt-0:#f5f5f7;--txt-1:#d2d2d7;--txt-2:#a1a1a6;--txt-3:#86868b;--txt-4:#6e6e73;--txt-5:#48484a;--white:#fff;--black:#000;--r-xs:10px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;--ease:cubic-bezier(0.22,1,0.36,1);--ease-ios:cubic-bezier(0.32,0.72,0,1);--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,monospace;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
html,body{background:var(--bg-0);color:var(--txt-0);font-family:var(--sans);font-size:15px;line-height:1.47059;letter-spacing:-0.022em;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body{background:linear-gradient(180deg,#050505 0%,#080808 100%);background-attachment:fixed}
body::before{content:"";position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:1000px;height:700px;background:radial-gradient(circle,rgba(20,20,20,0.9) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:"";position:fixed;top:20%;right:-200px;width:600px;height:500px;background:radial-gradient(circle,rgba(15,15,15,0.8) 0%,transparent 70%);pointer-events:none;z-index:0}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}input{font-family:inherit}
::selection{background:var(--white);color:var(--black)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
@media (max-width:640px){.wrap{padding:0 18px}}
.header{position:sticky;top:0;z-index:100;background:rgba(5,5,5,0.75);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid rgba(255,255,255,0.05)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:56px;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{height:28px;width:auto;display:block;filter:brightness(0) invert(1)}
.brand-title{font-size:15px;font-weight:600;letter-spacing:-0.024em;color:var(--txt-0)}
.hamburger{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.07);display:grid;place-items:center;color:var(--txt-1);transition:background .22s,transform .18s;flex-shrink:0}
.hamburger:hover{background:rgba(255,255,255,0.09);color:var(--txt-0)}
.hamburger:active{transform:scale(0.94)}
.hamburger svg{width:18px;height:18px;overflow:visible}
.hamburger .line{stroke:currentColor;stroke-width:1.8;stroke-linecap:round;transition:transform .3s;transform-origin:center;transform-box:fill-box}
.hamburger.active .line-top{transform:translateY(3px) rotate(45deg)}
.hamburger.active .line-bottom{transform:translateY(-3px) rotate(-45deg)}
.menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .22s}
.menu-backdrop.show{opacity:1;pointer-events:auto}
.menu{position:fixed;top:66px;right:24px;width:220px;background:rgba(24,24,26,0.92);backdrop-filter:saturate(160%) blur(24px);-webkit-backdrop-filter:saturate(160%) blur(24px);border:0.5px solid rgba(255,255,255,0.1);border-radius:18px;padding:6px;z-index:201;opacity:0;transform:translateY(-6px) scale(0.96);transform-origin:top right;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 24px 70px rgba(0,0,0,0.7)}

.menu-item svg{width:17px;height:17px;stroke-width:1.9;color:var(--txt-2)}
.back-row{display:flex;align-items:center;gap:12px;margin-top:22px}
.back{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 11px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);border-radius:100px;color:var(--txt-1);font-size:13.5px;font-weight:500;transition:background .22s,color .22s,transform .18s}
.back:hover{background:rgba(255,255,255,0.1);color:var(--txt-0)}

.back svg{width:14px;height:14px;stroke-width:2.2}
.layout{display:grid;grid-template-columns:1fr;gap:24px;margin-top:22px}
@media (min-width:900px){.layout{grid-template-columns:280px 1fr;gap:32px;align-items:start}}
.sidebar{display:flex;flex-direction:column;gap:20px}
@media (min-width:900px){.sidebar{position:sticky;top:80px}}

.tool-icon svg{width:24px;height:24px;stroke-width:1.8}

.panel{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.07);border-radius:var(--r-xl);overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,0.4)}

.modal-bg.show{display:flex}
.modal{background:rgba(20,20,22,0.95);border:0.5px solid rgba(255,255,255,0.12);border-radius:20px;max-width:640px;width:100%;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,0.8);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}

.modal-close:hover{background:rgba(255,255,255,0.1);color:var(--txt-0)}

.modal-close svg{width:14px;height:14px;stroke-width:2.2}
.modal-body{padding:20px;overflow-y:auto;font-size:14px;line-height:1.6;color:var(--txt-1);white-space:pre-wrap;word-break:break-word}
.modal-body::-webkit-scrollbar{width:6px}

.footer-links a{color:var(--txt-3);transition:color .18s;font-weight:500}

@media (max-width:640px){.footer{margin-top:48px}.footer-inner{flex-direction:column;text-align:center;gap:12px}}
</style>

<script>
"use strict";
/* Endpoint lokal — apikey di-handle backend */
const $ = id => document.getElementById(id);
const input = $("email"), btn = $("go"), refresh = $("refresh"), out = $("out");

(function(){
  try {
    const p = new URLSearchParams(location.search);
    const e = p.get("email");
    if(e) input.value = decodeURIComponent(e);
  } catch(e){}
})();

const ham=$("hamburger"),menu=$("menu"),bd=$("menuBackdrop");
function setMenu(o){menu.classList.toggle("show",o);bd.classList.toggle("show",o);ham.classList.toggle("active",o)}
ham.addEventListener("click",e=>{e.stopPropagation();setMenu(!menu.classList.contains("show"))});
bd.addEventListener("click",()=>setMenu(false));
document.addEventListener("click",e=>{if(!menu.contains(e.target)&&!ham.contains(e.target))setMenu(false)});

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function load(){
  const email = input.value.trim();
  if(!email){
    out.innerHTML = `<div class="err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span>Email tidak boleh kosong.</span></div>`;
    return;
  }
  btn.disabled = true; refresh.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Loading...`;
  out.innerHTML = "";
  try {
    const u = "/api/tempmail?action=inbox&email=" + encodeURIComponent(email);
    const res = await fetch(u, { headers:{ Accept:"application/json" }});
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    renderInbox(data);
  } catch(e){
    out.innerHTML = `<div class="err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span>Something went wrong. Please try again.</span></div>`;
  } finally {
    btn.disabled = false; refresh.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg> Check Inbox`;
  }
}

function findArray(o, d=0){
  if(d > 5 || !o) return null;
  if(Array.isArray(o)) return o;
  if(typeof o === "object"){
    for(const v of Object.values(o)){
      const r = findArray(v, d+1);
      if(r) return r;
    }
  }
  return null;
}

function renderInbox(data){
  let messages = null;
  if(Array.isArray(data)) messages = data;
  else if(data && typeof data === "object") messages = findArray(data);

  if(!messages || !messages.length){
    out.innerHTML = `<div class="empty-txt">Inbox kosong atau belum ada pesan masuk.</div>`;
    return;
  }

  const html = messages.map((m, i) => {
    if(typeof m !== "object" || !m) return "";
    const from = m.from || m.sender || m.from_email || m.email || "—";
    const subj = m.subject || m.title || m.subj || "(no subject)";
    const when = m.time || m.date || m.timestamp || m.receivedAt || "";
    return `<div class="mail-item" data-i="${i}">
      <div class="from">${esc(String(from))}</div>
      <div class="subj">${esc(String(subj))}</div>
      ${when ? `<div class="when">${esc(String(when))}</div>` : ""}
    </div>`;
  }).join("");

  out.innerHTML = `<div class="inbox-list">${html}</div>`;

  out.querySelectorAll(".mail-item").forEach(el => {
    el.addEventListener("click", () => {
      const i = parseInt(el.dataset.i, 10);
      showMessage(messages[i]);
    });
  });
}

function showMessage(msg){
  const from = msg.from || msg.sender || msg.email || "—";
  const subj = msg.subject || msg.title || "(no subject)";
  const body = msg.body || msg.message || msg.text || msg.content || msg.html || "(empty)";
  $("modalSubj").textContent = String(subj);
  $("modalFrom").textContent = String(from);
  $("modalBody").textContent = String(body).replace(/<[^>]+>/g, "");
  $("modalBg").classList.add("show");
}

$("modalClose").addEventListener("click", ()=>$("modalBg").classList.remove("show"));
$("modalBg").addEventListener("click", e => { if(e.target === $("modalBg")) $("modalBg").classList.remove("show"); });

btn.addEventListener("click", load);
refresh.addEventListener("click", load);
input.addEventListener("keydown", e => { if(e.key === "Enter") load(); });

if(input.value) load();
</script>
</body>
</html>
