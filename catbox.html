<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<link rel="icon" href="assets/logo.png">
<title>Catbox Uploader — Noerz Equipments</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg-0:#050505;--bg-1:#0c0c0c;--bg-2:#121212;--bg-3:#181818;--bg-4:#1f1f1f;--line-0:#1a1a1a;--line-1:#272727;--line-2:#333;--line-3:#404040;--txt-0:#f5f5f7;--txt-1:#d2d2d7;--txt-2:#a1a1a6;--txt-3:#86868b;--txt-4:#6e6e73;--txt-5:#48484a;--white:#fff;--black:#000;--r-xs:10px;--r-sm:12px;--r-md:16px;--r-lg:20px;--r-xl:24px;--ease:cubic-bezier(0.22,1,0.36,1);--ease-ios:cubic-bezier(0.32,0.72,0,1);--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,monospace;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
html,body{background:var(--bg-0);color:var(--txt-0);font-family:var(--sans);font-size:15px;line-height:1.47059;letter-spacing:-0.022em;font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
body{background:linear-gradient(180deg,#050505 0%,#080808 100%);background-attachment:fixed}
body::before{content:"";position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:1000px;height:700px;background:radial-gradient(circle,rgba(20,20,20,0.9) 0%,transparent 70%);pointer-events:none;z-index:0}
body::after{content:"";position:fixed;top:20%;right:-200px;width:600px;height:500px;background:radial-gradient(circle,rgba(15,15,15,0.8) 0%,transparent 70%);pointer-events:none;z-index:0}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}input{font-family:inherit}
::selection{background:var(--white);color:var(--black)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
@media (max-width:640px){.wrap{padding:0 18px}}
.header{position:sticky;top:0;z-index:100;background:rgba(5,5,5,0.75);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid rgba(255,255,255,0.05)}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:56px;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{height:28px;width:auto;display:block;filter:brightness(0) invert(1)}
.brand-title{font-size:15px;font-weight:600;letter-spacing:-0.024em;color:var(--txt-0)}
.hamburger{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.07);display:grid;place-items:center;color:var(--txt-1);transition:background .22s,transform .18s;flex-shrink:0}
.hamburger:hover{background:rgba(255,255,255,0.09);color:var(--txt-0)}
.hamburger:active{transform:scale(0.94)}
.hamburger svg{width:18px;height:18px;overflow:visible}
.hamburger .line{stroke:currentColor;stroke-width:1.8;stroke-linecap:round;transition:transform .3s;transform-origin:center;transform-box:fill-box}
.hamburger.active .line-top{transform:translateY(3px) rotate(45deg)}
.hamburger.active .line-bottom{transform:translateY(-3px) rotate(-45deg)}
.menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;opacity:0;pointer-events:none;transition:opacity .22s}
.menu-backdrop.show{opacity:1;pointer-events:auto}
.menu{position:fixed;top:66px;right:24px;width:220px;background:rgba(24,24,26,0.92);backdrop-filter:saturate(160%) blur(24px);-webkit-backdrop-filter:saturate(160%) blur(24px);border:0.5px solid rgba(255,255,255,0.1);border-radius:18px;padding:6px;z-index:201;opacity:0;transform:translateY(-6px) scale(0.96);transform-origin:top right;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 24px 70px rgba(0,0,0,0.7)}
.menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
@media (max-width:640px){.menu{right:16px;left:16px;width:auto}}
.menu-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;color:var(--txt-1);font-size:15px;font-weight:500;transition:background .12s,color .12s}
.menu-item:hover{background:rgba(255,255,255,0.06);color:var(--txt-0)}
.menu-item svg{width:17px;height:17px;stroke-width:1.9;color:var(--txt-2)}
.back-row{display:flex;align-items:center;gap:12px;margin-top:22px}
.back{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 11px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);border-radius:100px;color:var(--txt-1);font-size:13.5px;font-weight:500;transition:background .22s,color .22s,transform .18s}
.back:hover{background:rgba(255,255,255,0.1);color:var(--txt-0)}
.back:active{transform:scale(0.96)}
.back svg{width:14px;height:14px;stroke-width:2.2}
.layout{display:grid;grid-template-columns:1fr;gap:24px;margin-top:22px}
@media (min-width:900px){.layout{grid-template-columns:280px 1fr;gap:32px;align-items:start}}
.sidebar{display:flex;flex-direction:column;gap:20px}
@media (min-width:900px){.sidebar{position:sticky;top:80px}}
.tool-title-row{display:flex;align-items:center;gap:14px}
.tool-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,rgba(255,255,255,0.1),rgba(255,255,255,0.04));border:0.5px solid rgba(255,255,255,0.1);display:grid;place-items:center;color:var(--txt-0);flex-shrink:0;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.tool-icon svg{width:24px;height:24px;stroke-width:1.8}
.tool-name{font-size:22px;font-weight:600;letter-spacing:-0.032em;line-height:1.15;color:var(--txt-0);margin-bottom:3px}
.tool-cat{font-size:11px;font-family:var(--mono);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--txt-3)}
.tool-desc-inner{padding:16px 0;border-top:0.5px solid rgba(255,255,255,0.06);border-bottom:0.5px solid rgba(255,255,255,0.06)}
.tool-desc{font-size:14px;line-height:1.55;color:var(--txt-2)}
.panel{background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,0.07);border-radius:var(--r-xl);overflow:hidden;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:0.5px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02)}
.panel-title{font-size:13px;font-weight:600;color:var(--txt-1);display:flex;align-items:center;gap:9px}
.panel-title svg{width:14px;height:14px;stroke-width:2;color:var(--txt-3)}
.panel-meta{font-size:10.5px;font-family:var(--mono);color:var(--txt-3);display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:0.06em}
.panel-meta .dot{width:6px;height:6px;border-radius:50%;background:var(--white);box-shadow:0 0 0 3px rgba(255,255,255,0.15)}
.panel-body{padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;border-radius:14px;font-size:15px;font-weight:600;transition:background .22s,transform .18s;border:0.5px solid transparent;width:100%}
.btn svg{width:17px;height:17px;stroke-width:2.2}
.btn-primary{background:var(--white);color:var(--black);border-color:var(--white)}
.btn-primary:hover:not(:disabled){background:#e8e8e8;transform:translateY(-1px)}
.btn-primary:active:not(:disabled){transform:translateY(0) scale(0.985)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .65s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.result{margin-top:18px;background:rgba(0,0,0,0.3);border:0.5px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;animation:fadeUp .35s}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.result-head{padding:12px 16px;background:rgba(255,255,255,0.03);border-bottom:0.5px solid rgba(255,255,255,0.06);font-size:11px;font-weight:600;font-family:var(--mono);letter-spacing:0.08em;text-transform:uppercase;color:var(--txt-3);display:flex;justify-content:space-between}
.result-body{padding:16px}
.res-row{display:grid;grid-template-columns:140px 1fr;gap:16px;padding:11px 0;border-bottom:0.5px solid rgba(255,255,255,0.05);font-size:13.5px}
.res-row:last-child{border-bottom:none}
.res-key{font-size:11px;font-family:var(--mono);color:var(--txt-4);letter-spacing:0.06em;text-transform:uppercase;font-weight:500}
.res-val{color:var(--txt-0);word-break:break-word}
.res-val a{color:var(--txt-0);border-bottom:1px solid rgba(255,255,255,0.3);padding-bottom:1px}
.err{padding:14px 16px;background:rgba(255,255,255,0.03);border:0.5px dashed rgba(255,255,255,0.14);border-radius:14px;font-size:13.5px;color:var(--txt-2);display:flex;gap:11px;margin-top:18px}
.err svg{width:16px;height:16px;flex-shrink:0;color:var(--txt-1);margin-top:1px}
.drop{border:1px dashed rgba(255,255,255,0.14);border-radius:14px;background:rgba(0,0,0,0.25);padding:32px 20px;text-align:center;cursor:pointer;transition:background .22s,border-color .22s;display:flex;flex-direction:column;align-items:center;gap:12px}
.drop:hover,.drop.over{border-color:rgba(255,255,255,0.28);background:rgba(255,255,255,0.03)}
.drop-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);display:grid;place-items:center;color:var(--txt-2)}
.drop-icon svg{width:20px;height:20px;stroke-width:1.8}
.drop-title{font-size:14.5px;font-weight:600;color:var(--txt-0)}
.drop-sub{font-size:12px;color:var(--txt-3);font-family:var(--mono)}
.file-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(0,0,0,0.3);border:0.5px solid rgba(255,255,255,0.08);border-radius:12px;font-size:13px;margin-top:14px}
.file-row-icon{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,0.06);display:grid;place-items:center;color:var(--txt-2);flex-shrink:0}
.file-row-icon svg{width:15px;height:15px}
.file-row-name{flex:1;color:var(--txt-0);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row-size{color:var(--txt-4);font-family:var(--mono);font-size:11.5px}
.copy-btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.08);border-radius:100px;color:var(--txt-1);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .18s,color .18s,transform .18s;margin-top:14px;font-family:inherit}
.copy-btn:hover{background:rgba(255,255,255,0.1);color:var(--txt-0)}
.copy-btn:active{transform:scale(0.96)}
.copy-btn svg{width:13px;height:13px;stroke-width:2.2}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:#fff;color:#000;padding:11px 18px;border-radius:12px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9999;box-shadow:0 12px 40px rgba(0,0,0,0.6);display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:13px;height:13px;stroke-width:2.6}
.footer{margin-top:80px;padding:28px 0 36px;border-top:0.5px solid rgba(255,255,255,0.06);font-size:13px;color:var(--txt-4);position:relative;z-index:1}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.footer-brand{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--txt-2);font-weight:500}
.footer-brand img{height:18px;width:auto;filter:brightness(0) invert(1);opacity:0.75}
.footer-links{display:flex;gap:20px;font-size:13px}
.footer-links a{color:var(--txt-3);transition:color .18s;font-weight:500}
.footer-links a:hover{color:var(--txt-0)}
@media (max-width:640px){.footer{margin-top:48px}.footer-inner{flex-direction:column;text-align:center;gap:12px}}
</style>
</head>

<script>
"use strict";
/* Endpoint lokal — apikey di-handle backend */
const url = "/api/catbox";
const $ = id => document.getElementById(id);
const drop=$("drop"), fileIn=$("file"), info=$("fileInfo"), btn=$("go"), out=$("out");
let picked = null;
const MAX_SIZE = 60 * 1024 * 1024; /* 60 MB */

const ham=$("hamburger"),menu=$("menu"),bd=$("menuBackdrop");
function setMenu(o){menu.classList.toggle("show",o);bd.classList.toggle("show",o);ham.classList.toggle("active",o)}
ham.addEventListener("click",e=>{e.stopPropagation();setMenu(!menu.classList.contains("show"))});
bd.addEventListener("click",()=>setMenu(false));
document.addEventListener("click",e=>{if(!menu.contains(e.target)&&!ham.contains(e.target))setMenu(false)});

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function flatten(o,p="",r=[]){if(o==null)return r;if(typeof o!=="object"){r.push([p||"value",o]);return r}if(Array.isArray(o)){o.forEach((v,i)=>flatten(v,p?`${p}[${i}]`:`[${i}]`,r));return r}for(const[k,v]of Object.entries(o)){const key=p?`${p}.${k}`:k;if(v==null)continue;if(typeof v==="object")flatten(v,key,r);else r.push([key,v])}return r}

function toast(msg){
  let el = document.getElementById("__t");
  if(!el){
    el = document.createElement("div"); el.id="__t"; el.className="toast";
    el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span></span>';
    document.body.appendChild(el);
  }
  el.querySelector("span").textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove("show"), 1600);
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Copied"); } catch { toast("Copy failed"); }
    ta.remove();
  }
}

drop.addEventListener("click", ()=>fileIn.click());
drop.addEventListener("dragover", e=>{e.preventDefault();drop.classList.add("over")});
drop.addEventListener("dragleave", ()=>drop.classList.remove("over"));
drop.addEventListener("drop", e=>{
  e.preventDefault(); drop.classList.remove("over");
  if(e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
});
fileIn.addEventListener("change", ()=>{ if(fileIn.files[0]) setFile(fileIn.files[0]); });

function setFile(f){
  if(f.size > MAX_SIZE){
    info.innerHTML = `<div class="err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span>File terlalu besar. Max 60 MB.</span></div>`;
    btn.disabled = true;
    picked = null;
    return;
  }
  picked = f;
  info.innerHTML = `<div class="file-row">
    <div class="file-row-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/></svg></div>
    <div class="file-row-name">${esc(f.name)}</div>
    <div class="file-row-size">${(f.size/1024).toFixed(1)} KB</div>
  </div>`;
  btn.disabled = false;
}

function renderResult(data){
  const payload = data.result && typeof data.result==="object" ? data.result
                 : data.data   && typeof data.data  ==="object" ? data.data : data;
  const rows = flatten(payload);
  if(!rows.length){
    return `<div class="result"><div class="result-head">Response</div><div class="result-body"><pre style="font-family:var(--mono);font-size:11.5px;color:var(--txt-2);white-space:pre-wrap;word-break:break-word">${esc(JSON.stringify(data,null,2))}</pre></div></div>`;
  }
  return `<div class="result">
    <div class="result-head">Response <span style="color:var(--txt-4)">${rows.length} field${rows.length===1?"":"s"}</span></div>
    <div class="result-body" id="resBody">
      ${rows.map(([k,v])=>{
        const val = /^https?:\/\//i.test(String(v)) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>` : esc(v);
        return `<div class="res-row"><div class="res-key">${esc(k)}</div><div class="res-val">${val}</div></div>`;
      }).join("")}
    </div>
  </div>`;
}

btn.addEventListener("click", async ()=>{
  if(!picked) return;
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner"></span> Uploading...`;
  out.innerHTML = "";
  try {
    const fd = new FormData();
    fd.append("file", picked);
    /* apikey TIDAK dikirim dari frontend — backend yang inject */
    const res = await fetch(url, { method:"POST", body: fd });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    out.innerHTML = renderResult(data);
    const body = document.getElementById("resBody");
    if(body){
      const firstLink = body.querySelector("a[href^='http']");
      if(firstLink){
        const cb = document.createElement("button");
        cb.className = "copy-btn";
        cb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M6 15V6a2 2 0 0 1 2-2h9"/></svg>Copy URL';
        cb.addEventListener("click", ()=>copyText(firstLink.href));
        body.appendChild(cb);
      }
    }
  } catch(e){
    out.innerHTML = `<div class="err"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span>Something went wrong. Please try again.</span></div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V8M7 12l5-5 5 5M4 3h16"/></svg> Upload`;
  }
});
</script>
</body>
</html>
